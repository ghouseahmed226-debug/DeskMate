version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # DeskMate AI API
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deskmate-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://deskmate:deskmate_pass@postgres:5432/deskmate"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production-32chars}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-jwt-key-in-production}"
      FERNET_KEY: "${FERNET_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "info"
      WORKERS: "2"
    volumes:
      - deskmate_data:/app/data
      - deskmate_audit:/app/audit_log.jsonl
      - ./mock_data:/app/mock_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - deskmate-net

  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: deskmate-postgres
    environment:
      POSTGRES_USER: deskmate
      POSTGRES_PASSWORD: deskmate_pass
      POSTGRES_DB: deskmate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskmate -d deskmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - deskmate-net

  # ---------------------------------------------------------------------------
  # Redis (rate limiting, session cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: deskmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - deskmate-net

# ---------------------------------------------------------------------------
# Volumes and networks
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  deskmate_data:
  deskmate_audit:

networks:
  deskmate-net:
    driver: bridge
